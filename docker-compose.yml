version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: social_debate_postgres
    environment:
      POSTGRES_USER: debateuser
      POSTGRES_PASSWORD: debatepass
      POSTGRES_DB: social_debate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debateuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social_debate_backend
    environment:
      DATABASE_URL: postgresql://debateuser:debatepass@postgres:5432/social_debate
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT}
      SCHEDULER_ENABLED: "false"  # Disable for local dev to avoid conflicts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:18-alpine
    container_name: social_debate_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: npm run dev

volumes:
  postgres_data:
