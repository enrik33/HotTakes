# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code
#
# Required environment variables to set in the Railway dashboard:
#   DATABASE_URL      — Provided automatically by Railway Postgres plugin
#   ENVIRONMENT       — Set to: production
#   SCHEDULER_ENABLED — Set to: true
#   CORS_ORIGINS      — Comma-separated list including your Vercel domain,
#                       e.g. https://your-app.vercel.app
#   SECRET_KEY        — Any long random string
#
# Optional:
#   SENTRY_DSN        — Sentry DSN for error tracking

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
